[package]
name = "keymint"
version = "2.0.0"
edition = "2024"
rust-version = "1.100"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
humantime = "2"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "time", "net", "signal", "sync"] }
zeroize = "1"
base64 = "0.22"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
tempfile = "3"
axum = "0.8"
rpassword = "7"
ring = "0.17"
data-encoding = "2"
subtle = "2"
crypto_box = { version = "0.9", features = ["seal"] }
webauthn-rs-core = "=0.6.2"
serde_cbor_2 = "0.13"
qrcode = { version = "0.14", default-features = false }
png = "0.17"
axum-server = { version = "0.9", features = ["tls-rustls-ring"] }
prometheus = { version = "0.14", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }

ipnet = { version = "2", features = ["serde"] }

httpdate = "1"

opentelemetry = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "grpc-tonic", "tls-roots"] }
opentelemetry-stdout = { version = "0.31", default-features = false, features = ["trace"] }
tracing-opentelemetry = { version = "0.32", default-features = false }

[build-dependencies]
serde_json = "1"
